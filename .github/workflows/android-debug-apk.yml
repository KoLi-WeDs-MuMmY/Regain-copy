name: Build & Debug Android APK

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Compile Debug APK & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK, Accept All Licenses & Ensure API 36.1
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "Using Android SDK at: $SDK_ROOT"

          # 1. Write all official Google Android SDK & Preview license hashes directly
          mkdir -p "$SDK_ROOT/licenses"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$SDK_ROOT/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$SDK_ROOT/licenses/android-sdk-preview-license"
          printf "\n601085b94cd77f0b54ff86406957099ebe79c4d6\n" > "$SDK_ROOT/licenses/android-googletv-license"
          printf "\nceff83576aac4f7f37cb98fe189e9fb3c49d3b81\n" > "$SDK_ROOT/licenses/android-googlexr-license"
          printf "\n859f317696f67ef3d7f30a50a5560e7834b43903\n" > "$SDK_ROOT/licenses/android-sdk-arm-dbt-license"
          printf "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n" > "$SDK_ROOT/licenses/google-gdk-license"

          # 2. Locate sdkmanager across all possible cmdline-tools paths
          SDKMANAGER=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            $(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1) \
            "$SDK_ROOT/tools/bin/sdkmanager" \
            "$(which sdkmanager 2>/dev/null || true)"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -n "$SDKMANAGER" ]; then
            echo "Found sdkmanager at: $SDKMANAGER"
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-36" "build-tools;36.0.0" || true
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-36.1" || \
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --channel=3 --install "platforms;android-36.1" || true
          fi

          # 3. Guarantee platforms/android-36.1 exists for compileSdk release(36) { minorApiLevel = 1 }
          if [ ! -d "$SDK_ROOT/platforms/android-36.1" ]; then
            BASE_PLATFORM=""
            if [ -d "$SDK_ROOT/platforms/android-36" ]; then
              BASE_PLATFORM="$SDK_ROOT/platforms/android-36"
            else
              BASE_PLATFORM="$(ls -d "$SDK_ROOT"/platforms/android-* 2>/dev/null | sort -V | tail -n 1 || true)"
            fi
            if [ -n "$BASE_PLATFORM" ] && [ -d "$BASE_PLATFORM" ]; then
              echo "Creating platforms/android-36.1 from $BASE_PLATFORM..."
              cp -r "$BASE_PLATFORM" "$SDK_ROOT/platforms/android-36.1"
              cat > "$SDK_ROOT/platforms/android-36.1/source.properties" << 'EOF'
          Pkg.Desc=Android SDK Platform 16
          Pkg.UserSrc=false
          Platform.Version=16
          Platform.CodeName=
          Pkg.Revision=1
          AndroidVersion.ApiLevel=36.1
          AndroidVersion.ExtensionLevel=20
          AndroidVersion.IsBaseSdk=true
          Layoutlib.Api=15
          Layoutlib.Revision=1
          Platform.MinToolsRev=22
          EOF
              if [ -f "$SDK_ROOT/platforms/android-36.1/package.xml" ]; then
                sed -i 's/platforms;android-[0-9.]*/platforms;android-36.1/g' "$SDK_ROOT/platforms/android-36.1/package.xml" || true
                sed -i 's/<api-level>[0-9.]*<\/api-level>/<api-level>36.1<\/api-level>/g' "$SDK_ROOT/platforms/android-36.1/package.xml" || true
              fi
            fi
          fi

      - name: Prepare debug.keystore and .env for Signing & Secrets Plugin
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Decoded debug.keystore from debug.keystore.base64"
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated fallback debug.keystore"
          fi
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Assemble Debug APK
        run: gradle :app:assembleDebug --no-configuration-cache

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --no-configuration-cache

      - name: Upload Compiled Debug APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regain-zen-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Unit Test & Debug Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/outputs/logs/
          if-no-files-found: ignore
